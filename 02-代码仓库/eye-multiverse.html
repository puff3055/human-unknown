<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020208">
  <meta name="description" content="HUMAN UNKNOWN — 每一声 hey，都会让一个新世界看见你。">
  <title>HUMAN UNKNOWN — EYE MULTIVERSE</title>
  <link rel="preload" as="image" href="assets/eye-orb-source-cutout.png">
  <link rel="stylesheet" href="eye-multiverse.css?v=0.7.0">
</head>
<body>
  <main class="multiverse" id="multiverse" data-state="idle" data-input="pointer">
    <canvas id="multiverseCanvas" class="multiverse__canvas" aria-hidden="true"></canvas>
    <canvas id="networkCanvas" class="multiverse__network multiverse__network--back" aria-hidden="true"></canvas>
    <canvas id="networkFrontCanvas" class="multiverse__network multiverse__network--front" aria-hidden="true"></canvas>
    <div class="multiverse__veil" aria-hidden="true"></div>

    <header class="multiverse__header">
      <p class="multiverse__brand"><i aria-hidden="true"></i>EYE MULTIVERSE</p>
      <div class="multiverse__tools">
        <div class="multiverse__counter" aria-live="polite" aria-label="已回应的新世界数量">
          <span id="count">00</span>
          <small>WORLDS ANSWERED</small>
        </div>
        <button class="multiverse__sound" id="soundButton" type="button" aria-pressed="false" aria-label="开启声音">
          <img id="soundIcon" src="assets/tabler-volume-off.svg" alt="">
        </button>
      </div>
    </header>

    <section class="multiverse__voice-dock" id="voicePanel" aria-label="语音交互">
      <button class="multiverse__listen" id="listenButton" type="button" aria-label="开启麦克风">
        <img id="microphoneIcon" src="assets/tabler-microphone.svg" alt="">
        <span class="multiverse__listen-trace" aria-hidden="true"></span>
      </button>
      <div class="multiverse__voice-body">
        <div class="multiverse__voice-copy" aria-live="polite" aria-atomic="true">
          <span class="multiverse__voice-state" id="voiceState">让它们听见你</span>
          <span class="multiverse__transcript" id="transcript">麦克风未开启</span>
          <span class="multiverse__token" id="signalToken" aria-hidden="true">HEY · +1</span>
        </div>
        <canvas class="multiverse__wave" id="voiceWave" width="620" height="72" aria-hidden="true"></canvas>
      </div>
    </section>

    <p class="visually-hidden" id="status" aria-live="assertive" aria-atomic="true"></p>
  </main>
  <noscript>请启用 JavaScript，让这个世界回应你。</noscript>
  <script src="eye-multiverse.js?v=0.7.0"></script>
</body>
</html>
