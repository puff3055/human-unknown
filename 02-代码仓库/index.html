<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="HUMAN UNKNOWN — 人类的世界，只是世界的一种解释。">
  <title>HUMAN UNKNOWN</title>
  <link rel="preload" as="image" href="assets/home-contact-background.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contact" id="contact" data-phase="waiting">
    <div class="cosmos" id="cosmos" aria-hidden="true">
      <canvas id="particleCanvas"></canvas>
      <img
        class="particle-fallback"
        id="particleFallback"
        src="assets/home-contact-background.png"
        alt=""
        width="1672"
        height="941"
        draggable="false"
      >
    </div>

    <header class="identity" aria-label="HUMAN UNKNOWN">
      <h1>HUMAN UNKNOWN</h1>
      <p>人类的世界，只是世界的一种解释。</p>
    </header>

    <div class="guide" aria-live="polite" aria-atomic="true">
      <p id="guideText"></p>
    </div>

    <div class="contact-cursor" id="contactCursor" aria-hidden="true">
      <span></span>
    </div>
  </main>

  <noscript>请启用 JavaScript，完成这次接触。</noscript>
  <script src="particle-eye.js"></script>
  <script src="app.js"></script>
</body>
</html>
