<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World 1 visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090b09; color: #dcddd4; }
    body { padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { display: flex; justify-content: space-between; max-width: 900px; margin: 0 auto 10px; color: #aeb1a8; font-size: 12px; letter-spacing: .12em; }
    main { display: grid; gap: 12px; max-width: 900px; margin: 0 auto; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin-bottom: 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    img { display: block; width: 100%; height: auto; border: 1px solid #30342e; }
  </style>
</head>
<body>
  <header><span>WORLD 1 / DESKTOP 1672 × 941</span><span id="sceneLabel"></span></header>
  <main>
    <figure>
      <figcaption>Reference master</figcaption>
      <img id="reference" alt="Reference master">
    </figure>
    <figure>
      <figcaption>Browser implementation</figcaption>
      <img id="implementation" alt="Browser implementation">
    </figure>
  </main>
  <script>
    const requested = Number(new URLSearchParams(window.location.search).get('scene'));
    const scene = Math.min(6, Math.max(1, Number.isFinite(requested) ? requested : 1));
    const id = String(scene).padStart(2, '0');
    document.getElementById('sceneLabel').textContent = `SCENE ${id} / 06`;
    document.getElementById('reference').src = `../../assets/world1/scene-${id}.png`;
    document.getElementById('implementation').src = `./final-desktop-scene-${id}.png`;
  </script>
</body>
</html>
