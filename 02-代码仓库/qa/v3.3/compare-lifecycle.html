<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUMAN UNKNOWN V3.3 — lifecycle comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #101010; color: #bdbdbd; font: 12px/1.2 monospace; }
    .labels, .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .labels div { height: 28px; display: grid; place-items: center; background: #070707; letter-spacing: .12em; }
    .frame { height: 520px; overflow: hidden; position: relative; background: #000; }
    .frames img { display: block; width: 1672px; height: 941px; max-width: none; transform: translate(-180px, -185px); }
  </style>
</head>
<body>
  <div class="labels">
    <div>GROWTH / DECAY · MID CYCLE</div>
    <div>RESIDUE / REBIRTH · NEXT CYCLE</div>
  </div>
  <div class="frames">
    <div class="frame"><img src="01-idle-growth.png" alt="Growth and decay in progress"></div>
    <div class="frame"><img src="03-idle-rebirth.png" alt="Residue and rebirth beginning elsewhere"></div>
  </div>
</body>
</html>
