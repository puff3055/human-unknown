<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUMAN UNKNOWN V3.1 — hover diffusion comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #101010; color: #bdbdbd; font: 12px/1.2 monospace; }

    .labels div { height: 28px; display: grid; place-items: center; background: #070707; letter-spacing: .12em; }
    .frames img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="labels"><div>POINTER MOVING · NO SIGNAL</div><div>POINTER RESTING · BRANCHED SIGNAL</div></div>
  <div class="frames">
    <img src="21-hover-before-final.png" alt="Before hover diffusion">
    <img src="23-hover-wide-final.png" alt="Branched hover diffusion">
  </div>
</body>
</html>
