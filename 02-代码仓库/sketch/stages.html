<!DOCTYPE html><html><head><meta charset="utf-8"><title>阶段素材</title>
<style>body{margin:0;background:#000;color:#aaa;font:12px sans-serif;letter-spacing:.2em}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px}
.c{position:relative}.c canvas{width:100%;display:block;background:#000}.c span{position:absolute;left:10px;top:8px}</style></head>
<body><div class="g" id="g"></div>
<script>
const STAGES=['1 火光','2 村落','3 围墙与塔','4 城市','5 灯海','6 废墟','7 高塔','8 光离开'];
const W=720,H=400;
function rng(s){return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%1e5)/1e5}}
function ground(ctx,r){ // 地平线：一块微微起伏的土地
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,H*0.55,0,H);g.addColorStop(0,'rgba(60,70,90,0)');g.addColorStop(1,'rgba(60,70,90,.18)');
  ctx.fillStyle=g;ctx.fillRect(0,H*0.55,W,H*0.45);
  ctx.strokeStyle='rgba(120,130,150,.25)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=4){const y=H*0.62+Math.sin(x*0.01)*6+Math.sin(x*0.033)*3;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
}
const hy=x=>H*0.62+Math.sin(x*0.01)*6+Math.sin(x*0.033)*3;
function fire(ctx,x,r,n=1){for(let i=0;i<n;i++){const y=hy(x)-2;const g=ctx.createRadialGradient(x,y,0,x,y,18);g.addColorStop(0,'rgba(255,190,90,.9)');g.addColorStop(.3,'rgba(255,120,40,.5)');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(x-18,y-18,36,36);ctx.fillStyle='#ffe0a0';ctx.fillRect(x-1,y-3,2,3)}}
function hut(ctx,x,w,h,col){const y=hy(x);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y-h*0.55);ctx.lineTo(x,y-h);ctx.lineTo(x+w/2,y-h*0.55);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(255,200,120,.9)';ctx.fillRect(x-1,y-h*0.35,2,2)}
function tower(ctx,x,w,h,col,lit){const y=hy(x);ctx.fillStyle=col;ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle=lit;for(let yy=y-h+4;yy<y-3;yy+=5)for(let xx=x-w/2+2;xx<x+w/2-1;xx+=4)if(Math.random()<.55)ctx.fillRect(xx,yy,1.6,2)}
function wall(ctx,x0,x1,col){ctx.fillStyle=col;const y0=hy(x0),y1=hy(x1);ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,y0-14);ctx.lineTo(x1,y1-14);ctx.lineTo(x1,y1);ctx.fill();for(let x=x0;x<x1;x+=8)ctx.fillRect(x,hy(x)-18,4,4)}
function ruin(ctx,x,w,h){const y=hy(x);ctx.fillStyle='rgba(110,115,130,.45)';ctx.fillRect(x-w/2,y-h*0.35,w*0.3,h*0.35);ctx.fillRect(x+w*0.05,y-h*0.6,w*0.25,h*0.6);ctx.strokeStyle='rgba(110,115,130,.35)';ctx.strokeRect(x-w/2,y-h,w,h)}
function spire(ctx,x,h){const y=hy(x);ctx.strokeStyle='rgba(180,220,255,.9)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x,y-h);ctx.lineTo(x+6,y);ctx.stroke();const g=ctx.createRadialGradient(x,y-h,0,x,y-h,40);g.addColorStop(0,'rgba(200,230,255,.9)');g.addColorStop(1,'rgba(200,230,255,0)');ctx.fillStyle=g;ctx.fillRect(x-40,y-h-40,80,80);for(let i=1;i<5;i++){ctx.strokeStyle=`rgba(180,220,255,${.5-i*.08})`;ctx.beginPath();ctx.moveTo(x-6-i*3,y-i*h/5);ctx.lineTo(x+6+i*3,y-i*h/5);ctx.stroke()}}
const draws=[
 ctx=>{const r=rng(1);fire(ctx,W*0.5);fire(ctx,W*0.42);hut(ctx,W*0.47,14,12,'#2a2621')},
 ctx=>{const r=rng(2);for(let i=0;i<14;i++){const x=W*0.3+r()*W*0.4;hut(ctx,x,12+r()*8,10+r()*8,'#2c2822')}fire(ctx,W*0.5);fire(ctx,W*0.38);fire(ctx,W*0.61)},
 ctx=>{const r=rng(3);wall(ctx,W*0.22,W*0.78,'#3a3630');for(let i=0;i<30;i++){const x=W*0.26+r()*W*0.48;hut(ctx,x,10+r()*8,10+r()*10,'#332e27')}tower(ctx,W*0.5,14,60,'#3f3a33','rgba(255,210,140,.8)');tower(ctx,W*0.32,10,40,'#3f3a33','rgba(255,210,140,.8)');tower(ctx,W*0.66,10,44,'#3f3a33','rgba(255,210,140,.8)');fire(ctx,W*0.44);fire(ctx,W*0.57)},
 ctx=>{const r=rng(4);for(let i=0;i<70;i++){const x=W*0.12+r()*W*0.76;tower(ctx,x,6+r()*10,20+r()*70,'#2b2f38','rgba(255,225,170,.85)')}for(let i=0;i<20;i++){const x=W*0.3+r()*W*0.4;hut(ctx,x,10,10,'#2a2722')}},
 ctx=>{const r=rng(5);for(let i=0;i<160;i++){const x=W*0.04+r()*W*0.92;tower(ctx,x,4+r()*10,20+r()*130,'#232833','rgba(200,235,255,.9)')}const g=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,W*0.5);g.addColorStop(0,'rgba(160,200,255,.12)');g.addColorStop(1,'rgba(160,200,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)},
 ctx=>{const r=rng(6);for(let i=0;i<40;i++){const x=W*0.1+r()*W*0.8;ruin(ctx,x,8+r()*12,20+r()*90)}for(let i=0;i<6;i++){const x=W*0.2+r()*W*0.6;tower(ctx,x,6,30+r()*40,'#20242c','rgba(200,235,255,.5)')}const g=ctx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,W*0.4);g.addColorStop(0,'rgba(120,120,130,.1)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)},
 ctx=>{const r=rng(7);for(let i=0;i<50;i++){const x=W*0.1+r()*W*0.8;tower(ctx,x,4+r()*8,20+r()*80,'#1c2230','rgba(160,220,255,.7)')}spire(ctx,W*0.5,230);spire(ctx,W*0.36,150);spire(ctx,W*0.64,160)},
 ctx=>{const r=rng(8);for(let i=0;i<50;i++){const x=W*0.1+r()*W*0.8;ctx.fillStyle='rgba(60,70,90,.3)';ctx.fillRect(x-3,hy(x)-10-r()*50,6,10+r()*50)}for(let i=0;i<300;i++){const a=r()*6.28,d=r()*160;const x=W/2+Math.cos(a)*d,y=H*0.3+Math.sin(a)*d*0.6-d*0.3;ctx.fillStyle=`rgba(200,230,255,${(1-d/160)*.9})`;ctx.fillRect(x,y,1.5,1.5)}}
];
STAGES.forEach((n,i)=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<canvas width="${W}" height="${H}"></canvas><span>${n}</span>`;document.getElementById('g').appendChild(d);const ctx=d.querySelector('canvas').getContext('2d');ground(ctx);draws[i](ctx)});
</script></body></html>
